
# =============================================================================
# docker-compose.integration.yml — Etapa 7 / 9.5
# Orquestación conjunta MS1 (Gateway) + MS3 (CRUD) -> MS2 (Extract)
# con MongoDB como única dependencia de persistencia.
#
# Uso (desde la carpeta pdfinfraestructure/):
#   docker compose -f docker-compose.integration.yml config --quiet   # validar
#   docker compose -f docker-compose.integration.yml build
#   docker compose -f docker-compose.integration.yml up -d
#
# Este archivo NO depende de los Compose individuales de cada repositorio.
# Traefik público e interno son infraestructura exclusiva de este Compose.
# =============================================================================

services:
  traefik-public:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`proxy.scope`,`public`)"
      - "--entrypoints.web.address=:80"
      - "--api=false"
    ports:
      - "127.0.0.1:${TRAEFIK_PUBLIC_HOST_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_public

  traefik-internal:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`proxy.scope`,`internal`)"
      - "--entrypoints.internal.address=:8080"
      - "--api=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_internal

  # ---------------------------------------------------------------------------
  # 1. MongoDB — única persistencia; aislado en db_net (solo MS3)
  # ---------------------------------------------------------------------------
  db:
    image: mongo:8.0
    container_name: integracion_mongo_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # 2. MS2 — stateless, sin MongoDB; escalar con --scale extract-service=N
  # ---------------------------------------------------------------------------
  extract-service:
    build:
      context: ../pdfextractext
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Configuración real de MS2: límite de tamaño de PDF (MB)
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Admisión por réplica (Factor 8): misma cuota que en los benchmarks
      # de una instancia. Con 5 réplicas la capacidad agregada es 5 × 2 = 10.
      MAX_ADMITTED_EXTRACTIONS: ${MAX_ADMITTED_EXTRACTIONS:-2}
    # Misma cuota por réplica usada en los benchmarks de una instancia
    # (pdfextractext/docker-compose.yml). El límite es por contenedor.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      # GET /health verificado en MS2 (src/main.py). La imagen base
      # python:3.12-slim no incluye curl; se usa la stdlib de Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy_internal
    labels:
      - "traefik.enable=true"
      - "proxy.scope=internal"
      - "traefik.docker.network=proxy_internal"
      - "traefik.http.routers.ms2-internal.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ms2-internal.entrypoints=internal"
      - "traefik.http.routers.ms2-internal.service=ms2"
      - "traefik.http.services.ms2.loadbalancer.server.port=8000"
      - "traefik.http.services.ms2.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.ms2.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.ms2.loadbalancer.healthcheck.timeout=3s"

  # ---------------------------------------------------------------------------
  # 3. MS3 — orquestador del flujo síncrono
  # ---------------------------------------------------------------------------
  crud-service:
    build:
      context: ../pdfcrudservice
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      # Espera a MongoDB sano antes de arrancar (el lifespan de MS3
      # falla el startup si la BD no responde).
      db:
        condition: service_healthy
    environment:
      # --- MongoDB (usuarios independientes de aplicación y testing) ---
      MONGO_URL: "${MONGO_URL_DOCKER:?Defina MONGO_URL_DOCKER en el archivo .env}"
      MONGO_TEST_URL: "${MONGO_TEST_URL_DOCKER:?Defina MONGO_TEST_URL_DOCKER en el archivo .env}"
      MONGO_DB_DEV: ${MONGO_DB_DEV:-pdf_database_dev}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-processed_pdfs}
      # --- Límite de tamaño de PDF (MB) ---
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      # --- Configuración de comunicación con MS2 ---
      # URL BASE únicamente: el código de MS3 agrega el path /extract.
      # NO incluir /extract aquí (provocaría /extract/extract).
      EXTRACT_SERVICE_URL: ${EXTRACT_SERVICE_URL_DOCKER:-http://traefik-internal:8080}
      EXTRACT_SERVICE_TIMEOUT: ${EXTRACT_SERVICE_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      # GET /health de MS3 (FastAPI). python:3.12-slim no incluye curl;
      # se usa la stdlib de Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net
      - proxy_internal
      - db_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

  # ---------------------------------------------------------------------------
  # 4. MS1 — único servicio de aplicación alcanzable desde Traefik público
  # ---------------------------------------------------------------------------
  gateway-service:
    build:
      context: ../pdfapigateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      # Espera a que MS3 esté sana: el gateway deriva toda solicitud a MS3.
      crud-service:
        condition: service_healthy
    environment:
      # URL base de MS3 dentro de Docker (nombre de servicio, puerto interno).
      # El código de MS1 agrega el path /documents.
      MS3_URL: ${MS3_URL_DOCKER:-http://crud-service:8000}
      MS3_TIMEOUT: ${MS3_TIMEOUT:-40}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      # GET /health del gateway. python:3.12-slim no incluye curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy_public
      - app_net
    labels:
      - "traefik.enable=true"
      - "proxy.scope=public"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.ms1-public.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ms1-public.entrypoints=web"
      - "traefik.http.routers.ms1-public.service=ms1"
      - "traefik.http.services.ms1.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

# -----------------------------------------------------------------------------
# Redes: cada proxy y servicio solo comparte las redes necesarias para su flujo.
# -----------------------------------------------------------------------------
networks:
  proxy_public:
    name: proxy_public
    driver: bridge
  app_net:
    name: app_net
    driver: bridge
  proxy_internal:
    name: proxy_internal
    driver: bridge
    internal: true
  db_net:
    name: db_net
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# Volúmenes
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
    name: pdfinfraestructure_mongo_data
